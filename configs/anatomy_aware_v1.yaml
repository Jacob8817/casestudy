schema_version: 1
experiment:
  id: anatomy_aware_brain_skull_v1
  description: Multi-task brain/skull segmentation with physical signed-distance supervision.

locks:
  phase1_contract: outputs/anatomy_aware_framework/phase1/frozen_contract.json
  development_inventory: outputs/brain_skull_benchmark/development_inventory.json
  official_test_locked: true

data:
  train_cases: 98
  validation_cases: 5
  labels: {background: 0, brain: 1, skull: 2}
  overlap_policy: skull_wins
  crop:
    method: ct_foreground_bbox
    threshold_hu: -900.0
    margin_voxels: [10, 10, 10]
  input_channels:
    - brain_window_-100_200_HU
    - bone_window_-300_1500_HU
  roi_size: [96, 96, 96]
  foreground_patch_probability: 0.80
  cache_workers: 2

sdf:
  class_ids: [1, 2]
  sign_convention: positive_inside_negative_outside
  units_before_normalization: mm
  max_distance_mm: 25.0
  normalized_range: [-1.0, 1.0]

model:
  implementation: shared_monai_unet_with_separate_1x1_heads
  spatial_dims: 3
  in_channels: 2
  feature_channels: 16
  segmentation_channels: 3
  sdf_channels: 2
  channels: [16, 32, 64, 128]
  strides: [2, 2, 2]
  num_res_units: 2
  normalization: INSTANCE
  activation: PRELU
  dropout: 0.0

loss:
  segmentation:
    implementation: DiceCELoss
    weight: 1.0
    include_background: false
  sdf:
    implementation: SmoothL1Loss
    early_weight: 0.05
    middle_weight: 0.15
    late_weight: 0.25
    early_fraction: 0.333333
    middle_fraction: 0.666667
    boundary_band_normalized: 0.20
    boundary_multiplier: 4.0

training:
  epochs: 30
  validation_interval_epochs: 5
  optimizer: AdamW
  learning_rate: 0.0002
  weight_decay: 0.00001
  gradient_clip_norm: 12.0
  automatic_mixed_precision: true
  random_seed: 42
  checkpoint_metric: validation_macro_dice

inference:
  roi_size: [96, 96, 96]
  overlap: 0.25
  blend_mode: gaussian

outputs:
  root: outputs/anatomy_aware_framework/phase2
  cache: data/cache/anatomy_aware_phase2
